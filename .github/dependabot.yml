version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: "chore(deps)"
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: "chore(deps)"
      ignore:
          # @types/node majors move together with the Node runtime in mise.toml, by hand.
          - dependency-name: "@types/node"
            update-types: ["version-update:semver-major"]
    - package-ecosystem: docker-compose
      # Bumps pinned images in server/compose.yaml (the playit agent). itzg's `java21` is a moving tag and is left alone.
      directory: /server
      schedule:
          interval: weekly
      commit-message:
          prefix: "chore(deps)"
