# BastionPack local server: itzg/minecraft-server built from the SAME .mrpack friends install,
# plus a playit.gg agent for a public address. Run through `task server:up`.
name: engineers-tea

services:
    minecraft:
        image: itzg/minecraft-server:java21
        restart: unless-stopped
        # Optional fixed RCON password (server/rcon.env, gitignored); the backups service needs it.
        # Without the file the image generates a random one, which is fine when backups are off.
        env_file:
            - path: rcon.env
              required: false
        environment:
            EULA: "TRUE"
            TYPE: MODRINTH
            MEMORY: ${MEMORY:-4G}
            MODRINTH_MODPACK: ${MODRINTH_MODPACK}
            MODRINTH_VERSION: ${MODRINTH_VERSION:-}
            MODRINTH_EXCLUDE_FILES: ${MODRINTH_EXCLUDE_FILES:-}
            MODRINTH_FORCE_SYNCHRONIZE: ${MODRINTH_FORCE_SYNCHRONIZE:-false}
            # World seed for a new world (empty = random); see docs/guides/pregenerate-world.md.
            SEED: ${SEED:-}
            # authlib-injector agent for Ely.by and other auth servers; empty = Mojang (see AUTH_SERVER in .env).
            JVM_OPTS: ${AUTH_JVM_OPTS:-}
        volumes:
            # A named volume, not a bind mount: on Docker Desktop for Windows a bind mount makes the
            # NeoForge install and every world save cross the Windows/Linux boundary (minutes, not seconds).
            - minecraft-data:/data
            - ../build/modrinth:/modpacks:ro
            - ../build/authlib:/authlib:ro
        ports:
            - "25565:25565"
        tty: true
        stdin_open: true

    playit:
        # Same compose network as `minecraft`: in the playit dashboard set the tunnel's
        # local address to `minecraft:25565` (no host networking, which Docker Desktop lacks).
        image: ghcr.io/playit-cloud/playit-agent:1.2.0
        restart: unless-stopped
        environment:
            SECRET_KEY: ${PLAYIT_SECRET_KEY}
        depends_on:
            - minecraft

    backups:
        # Daily world backups (docs/guides/local-server-docker.md#automatic-backups). Opt-in:
        # start with `--profile backups` or set COMPOSE_PROFILES=backups; needs server/rcon.env.
        image: itzg/mc-backup:2026.10.3
        profiles: [backups]
        restart: unless-stopped
        env_file:
            - path: rcon.env
              required: false
        environment:
            CRON_SCHEDULE: ${BACKUP_CRON:-0 5 * * *}
            PRUNE_BACKUPS_DAYS: ${BACKUP_KEEP_DAYS:-7}
            TAR_COMPRESS_METHOD: zstd
            RCON_HOST: minecraft
        volumes:
            - minecraft-data:/data:ro
            - ${BACKUP_DIR:-./backups}:/backups
            # Cron runs on the host's local time.
            - /etc/localtime:/etc/localtime:ro
        depends_on:
            - minecraft

volumes:
    minecraft-data:
